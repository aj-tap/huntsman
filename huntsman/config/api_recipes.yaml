internetstormcast:
  enabled: true
  base_url: "https://isc.sans.edu/api"
  endpoints:
    ipv4-addr:
      method: "GET"
      path_template: "/ip/{identifier}?json"
      db_pool: "internetstormcast"
      ratelimit: "1/5s"
      pivots:
        autonomous-system: "yield ip.as | 'AS' +  cast(this, <string>)" 
        email-addr: "yield ip.asabusecontact"  
        domain-name: "yield ip.alexa.hostname" 
        location: "yield ip.ascountry"
    ipv6-addr:
      method: "GET"
      path_template: "/ip/{identifier}?json"
      db_pool: "internetstormcast"
      ratelimit: "1/5s"
      pivots:
        autonomous-system: "yield ip.as | 'AS' +  cast(this, <string>)" 
        email-addr: "yield ip.asabusecontact"  
        domain-name: "yield ip.alexa.hostname"     
        location: "yield ip.ascountry"

proxycheckio:
  enabled: true
  base_url: "http://proxycheck.io/v2"
  auth:
    type: "param"
    config:
      param_name: "key"
  endpoints:
    ipv4-addr:
      method: "GET"
      path_template: "/{identifier}"
      params_template:
        vpn: 1
        asn: 1
        risk: 1
        port: 1
        seen: 1
        days: 7
        tag: "msg"
      db_pool: "proxycheckio"
      ratelimit: "1/5s"
      pivots:
        autonomous-system: "over this | cut value | yield value.asn | quiet(this)" 
        domain-name: "over this | cut value | yield value.operator.url | quiet(this)"     
        location: "over this | cut value | yield value.isocode | quiet(this)"
        url: "over this | cut value | yield value.operator.url | quiet(this)"              
    email-addr:
      method: "GET"
      path_template: "/{identifier}"
      db_pool: "proxycheckio"
      ratelimit: "1/5s"

urlscanio:
  enabled: true
  base_url: "https://urlscan.io/api/v1"
  endpoints:
    ipv4-addr:
      method: "GET"
      path_template: "/search/"
      params_template:
        q: "ip:{identifier}"
      db_pool: "urlscanio"
      ratelimit: "1/5s"
      pivots:
        autonomous-system: "over results | yield page.asn | uniq" 
        domain-name: "over results  | fuse | sort -r task.time | yield page.domain | uniq | head 10"     

cve-services:
  enabled: true
  base_url: "https://cveawg.mitre.org/api/"
  endpoints:
    vulnerability:
      method: "GET"
      path_template: "/cve/{identifier}"
      db_pool: "cve-services"
      ratelimit: "1/5s"
      pivots:
        vulnerability: "yield cveMetadata.cveId"
        software: "yield containers"        

maclookup:
  enabled: true
  base_url: "https://api.maclookup.app/v2"
  endpoints:
    mac-addr:
      method: "GET"
      path_template: "/macs/{identifier}"
      db_pool: "maclookup"
      ratelimit: "1/5s"

certificatesearch:
  enabled: true
  base_url: "https://crt.sh"
  endpoints:
    domain-name:
      method: "GET"
      path_template: "/"
      params_template:
        q: "{identifier}"
        output: "json"
      db_pool: "certificatesearch"
      ratelimit: "1/5s"
      llm_ioc_extract: true
      
    x509-certificate:
      method: "GET"
      path_template: "/"
      params_template:
        q: "{identifier}"
        output: "json"
      db_pool: "certificatesearch"
      ratelimit: "1/5s"
      llm_ioc_extract: true

brave-news:
  enabled: true
  base_url: "https://api.search.brave.com/res/v1"
  auth:
    type: "header"
    config:
      header_name: "X-Subscription-Token"
  endpoints:
    threat-actor:
      method: "GET"
      path_template: "/news/search"
      params_template:
        q: "{identifier}"
      db_pool: "brave-news"
      ratelimit: "1/5s"
      llm_ioc_extract: true  
    domain-name:
      method: "GET"
      path_template: "/news/search"
      params_template:
        q: "{identifier}"
      db_pool: "brave-news"
      ratelimit: "1/5s"
      llm_ioc_extract: true
    software:
      method: "GET"
      path_template: "/news/search"
      params_template:
        q: "{identifier}"
      db_pool: "brave-news"
      ratelimit: "1/5s"
      llm_ioc_extract: true      
    vulnerability:
      method: "GET"
      path_template: "/news/search"
      params_template:
        q: "{identifier}"
      db_pool: "brave-news"
      ratelimit: "1/5s"
      llm_ioc_extract: true      

hunterhow:
  enabled: false
  base_url: "https://api.hunter.how"
  auth:
    type: "param"
    config:
      param_name: "api-key"
  endpoints:
    ipv4-addr:
      method: "GET"
      path_template: "/search"
      params_template:
        query:
          transform: "base64"
          template: 'ip="{identifier}"'
        start_time: "{start_date}"
        end_time: "{today}"
        page: 1
        page_size: 10
        fields: "ip"
      db_pool: "hunterhow"
      ratelimit: "1/2s"
      llm_ioc_extract: true

    domain-name:
      method: "GET"
      path_template: "/search"
      params_template:
        query:
          transform: "base64"
          template: 'domain="{identifier}"'
        start_time: "{start_date}"
        end_time: "{today}"
        page: 1
        page_size: 10
        fields: "ip,port,domain,asn,as_org,country,city,updated_at"
      db_pool: "hunterhow"
      ratelimit: "1/2s"
      llm_ioc_extract: true

dnsdumpster:
  enabled: true
  base_url: "https://api.dnsdumpster.com"
  auth:
    type: "header"
    config:
      header_name: "X-API-Key"
  endpoints:
    domain-name:
      method: "GET"
      path_template: "/domain/{identifier}"
      db_pool: "dnsdumpster"
      ratelimit: "1/2s"
      pivots:
        ipv4-addr: "over a | over ips | yield ip | uniq"
        domain-name: "over a | yield host | uniq"
        autonomous-system: "over a | over ips | yield asn |  'AS' +  cast(this, <string>) | uniq"
        location: "over a | over ips | yield country_code | uniq"

threatfox:
  enabled: true
  base_url: "https://threatfox-api.abuse.ch/api/v1/"
  auth:
    type: "header"
    config:
      header_name: "Auth-Key"
  endpoints:
    ipv4-addr:
      method: "POST"
      path_template: ""
      encoding: "json"
      body_template:
        query: "search_ioc"
        search_term: "{identifier}"
        exact_match: true
      db_pool: "threatfox"
      ratelimit: "1/2s"
      llm_ioc_extract: true

    domain-name:
      method: "POST"
      path_template: ""
      encoding: "json"
      body_template:
        query: "search_ioc"
        search_term: "{identifier}"
        exact_match: true
      db_pool: "threatfox"
      ratelimit: "1/2s"
      llm_ioc_extract: true

    md5:
      method: "POST"
      path_template: ""
      encoding: "json"
      body_template:
        query: "search_hash"
        hash: "{identifier}"
      db_pool: "threatfox"
      ratelimit: "1/2s"
      llm_ioc_extract: true

    sha256:
      method: "POST"
      path_template: ""
      encoding: "json"
      body_template:
        query: "search_hash"
        hash: "{identifier}"
      db_pool: "threatfox"
      ratelimit: "1/2s"
      llm_ioc_extract: true

censys:
  enabled: true
  base_url: "https://api.platform.censys.io/v3/global/asset"
  auth:
    type: "header"
    config:
      header_name: "Authorization"
      prefix: "Bearer "
  endpoints:
    ipv4-addr:
      method: "GET"
      path_template: "/host/{identifier}"
      headers:
        Accept: "application/vnd.censys.api.v3.host.v1+json"
      db_pool: "censys"
      pivots:
        autonomous-system: "yield result.resource.autonomous_system.asn |  'AS' +  cast(this, <string>) | uniq" 
        location: "yield result.resource.location.country_code"

    sha256:
      method: "GET"
      path_template: "/certificate/{identifier}"
      headers:
        Accept: "application/vnd.censys.api.v3.certificate.v1+json"
      db_pool: "censys"
      ratelimit: "1/2s"

fofa:
  enabled: false
  base_url: "https://fofa.info/api/v1"
  auth:
    type: "param"
    config:
      param_name: "key"
  endpoints:
    ipv4-addr:
      method: "GET"
      path_template: "/host/{identifier}"
      params_template:
        detail: "true"
      db_pool: "fofa"
      ratelimit: "1/1s"
      llm_ioc_extract: true

    domain-name:
      method: "GET"
      path_template: "/search/all"
      params_template:
        qbase64:
          transform: "base64"
          template: 'domain="{identifier}"'
        fields: "ip,host,port,asn,country"
        r_type: "json"
        size: 100
      db_pool: "fofa"
      ratelimit: "1/1s"
      llm_ioc_extract: true

malwarebazaar:
  enabled: true
  base_url: "https://mb-api.abuse.ch/api/v1"
  auth:
    type: "header"
    config:
      header_name: "Auth-Key"
  endpoints:
    sha256:
      method: "POST"
      path_template: "/"
      encoding: "form"
      body_template:
        query: "get_info"
        hash: "{identifier}"
      db_pool: "malwarebazaar"
      ratelimit: "1/2s"
      pivots:
        sha256: "over data | yield sha256_hash"
        md5: "over data | yield md5_hash"
        file-name: "over data | yield file_name"
        imphash : "over data | yield imphash"
        ssdeep: "over data | yield ssdeep"
    md5:
      method: "POST"
      path_template: "/"
      encoding: "form"
      body_template:
        query: "get_info"
