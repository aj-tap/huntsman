virustotal:
  enabled: true
  base_url: "https://www.virustotal.com/api/v3"
  auth:
    type: "header"
    config:
      header_name: "x-apikey"
  endpoints:
    domain-name:
      method: "GET"
      path_template: "/domains/{identifier}"
      db_pool: "virustotal"
      ratelimit: "1/5s"
      pivots:
        domain-name: "yield data.attributes.last_dns_records| type=='NS' or type=='MX'"
        autonomous-system: "yield data.attributes.asn | 'AS' +  cast(this, <string>)" 
        ipv4-addr: "over data.attributes.last_dns_records | type=='A'"
        ipv6-addr: "over data.attributes.last_dns_records | type=='AAAA'"
        email-addr: "yield data.attributes.whois"
        jarm: "yield data.attributes.jarm"
        x509-certificate: "yield data.attributes.last_https_certificate.thumbprint"
    ipv4-addr:
      method: "GET"
      path_template: "/ip_addresses/{identifier}"
      db_pool: "virustotal"
      ratelimit: "1/5s"
      pivots:
        ipv4-addr: "cut data.id"
        autonomous-system: "yield data.attributes.asn | 'AS' +  cast(this, <string>)" 
        domain-name: "yield data.attributes.last_https_certificate.subject.CN"
        email-addr: "yield data.attributes.whois"
        location: "yield data.attributes.country"
    ipv6-addr:
      method: "GET"
      path_template: "/ip_addresses/{identifier}"
      db_pool: "virustotal"
      ratelimit: "1/5s"
      pivots:
        ipv6-addr: "cut data.id"
        autonomous-system: "yield data.attributes.asn | 'AS' +  cast(this, <string>)" 
        email-addr: "yield data.attributes.whois"
        location: "yield data.attributes.country"
    sha256:
      method: "GET"
      path_template: "/files/{identifier}"
      db_pool: "virustotal"
      ratelimit: "1/5s"
      pivots:
        md5: "yield data.attributes.pe_info"
        sha1: "cut data.attributes.sha1"
        ssdeep: "cut data.attributes.ssdeep"
        win-reg-key: "yield data.attributes.sigma_analysis_results"
        imphash : "yield data.attributes.pe_info.imphash"
        authentihash: "yield data.attributes.authentihash"
    md5:
      method: "GET"
      path_template: "/files/{identifier}"
      db_pool: "virustotal"
      ratelimit: "1/5s"
      pivots:
        md5: "yield data.attributes.pe_info"
        sha1: "cut data.attributes.sha1"
        ssdeep: "cut data.attributes.ssdeep"
        win-reg-key: "yield data.attributes.sigma_analysis_results"
        imphash : "yield data.attributes.pe_info.imphash"
        authentihash: "yield data.attributes.authentihash"
    sha1:
      method: "GET"
      path_template: "/files/{identifier}"
      db_pool: "virustotal"
      ratelimit: "1/5s"
      pivots:
        md5: "yield data.attributes.pe_info"
        sha1: "cut data.attributes.sha1"
        ssdeep: "cut data.attributes.ssdeep"
        win-reg-key: "yield data.attributes.sigma_analysis_results"
        imphash : "yield data.attributes.pe_info.imphash"
        authentihash: "yield data.attributes.authentihash" 
    file:
      method: "GET"
      path_template: "/files/{identifier}"
      db_pool: "virustotal"
      ratelimit: "1/5s"
      pivots:
        md5: "yield data.attributes.pe_info"
        ssdeep: "cut data.attributes.ssdeep"
        win-reg-key: "yield data.attributes.sigma_analysis_results"
        imphash : "yield data.attributes.pe_info.imphash"
        authentihash: "yield data.attributes.authentihash"         
               
otx:
  enabled: true
  base_url: "https://otx.alienvault.com/api/v1"
  auth:
    type: "header"
    config:
      header_name: "X-OTX-API-KEY"
  endpoints:
    ipv4-addr:
      method: "GET"
      path_template: "/indicators/IPv4/{identifier}/general"
      db_pool: "otx"
      ratelimit: "1/5s"
      pivots:
        autonomous-system: "cut asn"
        attack-pattern:  "over pulse_info.pulses | over attack_ids | uniq | head 25"
        location: "yield country_code"
    ipv6-addr:
      method: "GET"
      path_template: "/indicators/IPv6/{identifier}/general"
      db_pool: "otx"
      ratelimit: "1/5s"
      pivots:
        autonomous-system: "cut asn"
        attack-pattern:  "over pulse_info.pulses | over attack_ids | uniq | head 25"
        location: "yield country_code"
    domain-name:
      method: "GET"
      path_template: "/indicators/domain/{identifier}/general"
      db_pool: "otx"
      ratelimit: "1/5s"
      pivots:
        attack-pattern:  "over pulse_info.pulses | over attack_ids | uniq | head 25"
    sha256:
      method: "GET"
      path_template: "/indicators/file/{identifier}/analysis"
      db_pool: "otx"
      ratelimit: "1/5s"
      pivots:
        sha256: "yield analysis.info.results.sha256"
        attack-pattern: "yield analysis.plugins.cuckoo | yield result['att&ck']"
        md5: "yield analysis.info.results.md5"
        sha1: "yield analysis.info.results.sha1"
        ssdeep: "yield analysis.info.results.ssdeep"
        file-name: "over analysis.plugins.cuckoo.result.signatures  | fuse | over marks | yield call | api=='NtWriteFile'| yield arguments.filepath"
        win-reg-key: "over analysis.plugins.cuckoo.result.signatures | fuse | over marks | reg_key!=null | yield reg_key"
        imphash : "yield analysis.plugins.pe32info"
        ipv4-addr: "yield analysis.plugins.cuckoo.result.network"
        ipv6-addr: "yield analysis.plugins.cuckoo.result.network"
        domain-name: "yield analysis.plugins.cuckoo.result.network"
        url: "yield analysis.plugins.metaextract.results.urls"
    file:
      method: "GET"
      path_template: "/indicators/file/{identifier}/analysis"
      db_pool: "otx"
      ratelimit: "1/5s"
      pivots:
        sha256: "yield analysis.info.results.sha256"
        attack-pattern: "yield analysis.plugins.cuckoo | yield result['att&ck']"
        md5: "yield analysis.info.results.md5"
        sha1: "yield analysis.info.results.sha1"
        ssdeep: "yield analysis.info.results.ssdeep"
        file-name: "over analysis.plugins.cuckoo.result.signatures  | fuse | over marks | yield call | api=='NtWriteFile'| yield arguments.filepath"
        win-reg-key: "over analysis.plugins.cuckoo.result.signatures | fuse | over marks | reg_key!=null | yield reg_key"
        imphash : "yield analysis.plugins.pe32info"
        ipv4-addr: "yield analysis.plugins.cuckoo.result.network"
        ipv6-addr: "yield analysis.plugins.cuckoo.result.network"
        domain-name: "yield analysis.plugins.cuckoo.result.network"
        url: "yield analysis.plugins.metaextract.results.urls"        
    vulnerability:
      method: "GET"
      path_template: "/indicators/cve/{identifier}/general"
      db_pool: "otx"
      ratelimit: "1/5s"
    url:
      method: "GET"
      path_template: "/indicators/url/{identifier}/general"
      db_pool: "otx"
      ratelimit: "1/5s"
      pivots:
        attack-pattern:  "over pulse_info.pulses | over attack_ids | uniq | head 25"        
        domain-name: "cut hostname, domain"

shodan:
  enabled: true
  base_url: "https://api.shodan.io"
  auth:
    type: "param"
    config:
      param_name: "key"
  endpoints:
    ipv4-addr:
      method: "GET"
      path_template: "/shodan/host/{identifier}"
      db_pool: "shodan"
      ratelimit: "1/5s"
      pivots:
        ipv4-addr : "over data | fuse | yield ip_str | uniq"
        domain-name: "yield domains"
        software: "cut cpes"
        location: "yield country_code"
        autonomous-system: "yield asn"
        vulnerability: "over data | fuse |  yield opts.vulns | uniq" 
        jarm: "over data | fuse |  yield ssl.jarm | uniq"       
    ipv6-addr:
      method: "GET"
      path_template: "/shodan/host/{identifier}"
      db_pool: "shodan"
      ratelimit: "1/5s"
      pivots:
        ipv4-addr : "over data | fuse | yield ip_str | uniq"
        domain-name: "yield domains"
        software: "cut cpes"
        location: "yield country_code"
        autonomous-system: "yield asn"
        vulnerability: "over data | fuse |  yield opts.vulns | uniq" 
        jarm: "over data | fuse |  yield ssl.jarm | uniq"      
        
    domain-name:
      method: "GET"
      path_template: "/dns/domain/{identifier}"
      db_pool: "shodan"
      ratelimit: "1/5s"
    jarm:
      method: "GET"
      path_template: "/shodan/host/search"
      params_template:
        query: "ssl.jarm:{identifier}"
      db_pool: "shodan"
      ratelimit: "1/5s"
      pivots:
        autonomous-system: "over matches | fuse | yield asn | uniq | head 25"
        ipv6-addr : "over matches | fuse | yield ipv6 | uniq | head 25"
        domain-name: "over matches | fuse | yield hostnames | uniq | head 25"
        x509-certificate: "over matches | fuse | yield ssl.cert.fingerprint.sha1 | uniq | head 25"
        location: "over matches | fuse | yield location.country_code | uniq"
        jarm: "over matches | fuse | yield ssl.jarm | uniq | head 25"
        software: "over matches | fuse | yield cpe | uniq | head 25"

    software:
      method: "GET"
      path_template: "/shodan/host/search"
      params_template:
        query: "cpe:{identifier}"
      db_pool: "shodan"
      ratelimit: "1/5s"
    x509-certificate:
      method: "GET"
      path_template: "/shodan/host/search"
      params_template:
        query: "ssl.cert.fingerprint:{identifier}"
      db_pool: "shodan"
      ratelimit: "1/5s"
      pivots:
        ipv6-addr : "over matches | fuse | yield ipv6 | uniq"
        domain-name: "over matches | fuse | yield hostnames | uniq"
        x509-certificate: "over matches | fuse | yield ssl.cert.fingerprint.sha1 | uniq"
        location: "over matches | fuse | yield location.country_code | uniq"
        autonomous-system: "over matches | fuse | yield asn"
        jarm: "over matches | fuse | yield ssl.jarm | uniq"  
        software: "over matches | fuse | yield cpe | uniq | head 25"

    autonomous-system:
      method: "GET"
      path_template: "/shodan/host/search"
      params_template:
        query: "asn:{identifier}"
      db_pool: "shodan"
      ratelimit: "1/5s"
      pivots:
        ipv4-addr : "over matches | fuse | yield ip_str | uniq"
        domain-name: "over matches | fuse | yield hostnames | uniq"
        x509-certificate: "over matches | fuse | yield ssl.cert.fingerprint.sha1 | uniq"
        location: "over matches | fuse | yield location.country_code | uniq"
        autonomous-system: "over matches | fuse | yield asn"
        jarm: "over matches | fuse | yield ssl.jarm | uniq" 
        software: "over matches | fuse | yield cpe | uniq | head 25"

    location:
      method: "GET"
      path_template: "/shodan/host/search"
      params_template:
        query: "country:{identifier}"
      db_pool: "shodan"
      ratelimit: "1/5s"

internetdb:
  enabled: true
  base_url: "https://internetdb.shodan.io"
  endpoints:
    ipv4-addr:
      method: "GET"
      path_template: "/{identifier}"
      db_pool: "internetdb"
      ratelimit: "1/5s"
      pivots:
        domain-name: "cut hostnames"
        software: "cut cpes"
        vulnerability: "cut vulns"
    ipv6-addr:
      method: "GET"
      path_template: "/{identifier}"
      db_pool: "internetdb"
      ratelimit: "1/5s"
      pivots:
        domain-name: "cut hostnames"
        software: "cut cpes"
        vulnerability: "cut vulns"

abuseipdb:
  enabled: true
  base_url: "https://api.abuseipdb.com/api/v2"
  auth:
    type: "header"
    config:
      header_name: "Key"
  static_headers:
    Accept: "application/json"
  endpoints:
    ipv4-addr:
      method: "GET"
      path_template: "/check"
      params_template:
        ipAddress: "{identifier}"
      db_pool: "abuseipdb"
      ratelimit: "1/5s"
      pivots:
        domain-name: "yield data | cut domain, hostnames"      
    ipv6-addr:
      method: "GET"
      path_template: "/check"
      params_template:
        ipAddress: "{identifier}"
      db_pool: "abuseipdb"
      ratelimit: "1/5s"
      pivots:
        domain-name: "yield data | cut domain, hostnames"    

ipinfo:
  enabled: true
